services:
  - type: web
    name: aether-server
    env: go
    plan: starter
    region: oregon
    buildCommand: "go build -o bin/aether-server ./cmd/aether-server"
    startCommand: "./bin/aether-server --port $PORT --data-dir /data/aether"
    healthCheckPath: /healthz
    disk:
      name: aether-cas-data
      mountPath: /data/aether
      sizeGB: 50
    envVars:
      - key: AETHER_ENV
        value: production
      - key: AETHER_PORT
        value: "8080"
      - key: AETHER_AUTH_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: aether-db
          property: connectionString

databases:
  - name: aether-db
    plan: starter
    region: oregon
    databaseName: aether
    user: aether_admin
